[package]
name = "shiranami-downloader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# `src/bin/` is this crate's binary-*manager* module (architecture §2.2 #19
# names it `downloader::bin`), not a directory of executables. Cargo would
# otherwise auto-discover targets there and fail over a file that is plainly a
# library module.
autobins = false

# The child process `tests/spawn_runner.rs` drives. Declared rather than
# discovered for the reason above, and kept under `tests/helpers/` rather than
# directly in `tests/` so Cargo does not also auto-discover it as a test target
# — it is a program, not a harness. `test = false` keeps it out of the suite for
# the same reason.
#
# It exists because the spawn tests used to reach for `/bin/sh`, which made them
# quietly Unix-only. See the helper's own docs for why a purpose-built child
# beats swapping in `cmd /C`.
[[bin]]
name = "spawn_helper"
path = "tests/helpers/spawn_helper.rs"
test = false
doc = false

[dependencies]
shiranami-core.workspace = true
shiranami-net.workspace = true
shiranami-db.workspace = true

async-trait = { workspace = true }
regex = { workspace = true }
# Header vocabulary only — `HeaderName`, `HeaderValue`, and the well-known
# constants. This crate constructs no `reqwest::Client`; that invariant belongs
# to `shiranami-net` and is untouched. `shiranami-serve` reaches the same types
# through axum's re-export, which this crate has no reason to depend on.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
# `macros` on top of the workspace feature set, for `select!` and `join!`. The
# version stays pinned in the workspace row; only this crate needs the macros,
# because only this crate races a child process against a deadline and a
# cancellation token while draining two pipes at once.
tokio = { workspace = true, features = ["macros"] }
# For `CancellationToken` alone, which is what a cancelled download, a cancelled
# playlist extraction and an `ExitRequested` sweep all reduce to. It lives in
# `tokio_util::sync`, which is ungated, so the workspace's `io`-only feature set
# is already enough.
tokio-util = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
# The binary managers are HTTP clients, so their tests bind a real loopback
# server and let them talk to it — a stubbed client would not exercise the
# redirect loop every one of these three download hosts actually uses.
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
