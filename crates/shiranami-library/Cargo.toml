[package]
name = "shiranami-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `shiranami-db` is deliberately absent, even though the phase plan orders this
# crate after Phase 7. The v1 scan pipeline never touches the database — it is a
# stateless scanner whose whole output crosses IPC, and `apps/web` does every
# read, diff and write itself. `apps/web` is unchanged in v2 (architecture
# §2.6), so it still does. See the crate docs for the full argument.
[dependencies]
shiranami-core.workspace = true
shiranami-metadata.workspace = true

fs4 = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
# Fixture trees are synthesised, not committed: `lofty` writes the tags the scan
# then reads back, so this crate carries no audio binaries of its own.
lofty = { workspace = true }
serde_json = { workspace = true }
# A *dev*-dependency only. The crate itself must never gain a database (see the
# crate docs); `tests/reconciliation.rs` needs one because the thing it pins is
# what the renderer does with a scan result, and "a moved file loses its play
# count" is a claim about rows, not about scans.
shiranami-db = { workspace = true }
# The repositories borrow `&mut SqliteConnection`, so the test that calls them
# needs the type by name.
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
