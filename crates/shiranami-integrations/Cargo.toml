[package]
name = "shiranami-integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
shiranami-core.workspace = true
shiranami-net.workspace = true
shiranami-db.workspace = true

# Lane A (lyrics · weather · share). Every row is already pinned in the
# workspace table — Phase 12's lyrics/weather/share port needs no Appendix B
# addition, because `lofty` (§2.2 row 22 names it for the embedded-tag source),
# `regex`, `tokio` and `serde` all arrived with earlier phases.
lofty = { workspace = true }
regex = { workspace = true }

# Lane B (scrobbling · Discord Rich Presence).
# The Discord IPC client. Blocking transport, so it lives behind the
# `PresenceSocket` trait and every call runs in `spawn_blocking`.
discord-rich-presence = { workspace = true }
futures = { workspace = true }
# Last.fm defines `api_sig` as md5 of the signature base string, so the
# algorithm is theirs, not a choice. Nothing security-bearing uses it.
md-5 = { workspace = true }
# The scrobble retry queue is a table now, so the service acquires from a pool
# around its network work — see `scrobble::service` for why it never holds one
# across a request.
sqlx = { workspace = true }

# Shared vocabulary. Header names and the status type only — `shiranami-net`
# stays the sole place a client is constructed. `url` supplies
# `form_urlencoded`, which is what `URLSearchParams` is — the encoder the
# weather URLs were built with; the LRCLIB URLs used `encodeURIComponent`
# instead and are encoded by hand (see `lyrics::query`).
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The lyrics write-back batch is the only wire surface this crate declares:
# `lyrics:save-batch`'s input, its progress tick and its summary. Same reason
# `shiranami-metadata` takes the pair — `specta_typescript::Number` pins the
# `usize` counters and the duration hint to `number` rather than to specta's
# default `number | null`.
specta = { workspace = true }
specta-typescript = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
# `CancellationToken`, for the write-back batch's cancel. The batch mirrors
# `shiranami_metadata::enrich::batch`, which takes it for the same reason.
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
