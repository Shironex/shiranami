packages:
  - 'apps/*'
  # Mobile excluded: its React Native deps break electron-builder packaging
  # (pnpm list --depth Infinity exceeds Node.js string limits).
  # Re-add when mobile is ready for release + upgrade web to React 19.
  - '!apps/mobile'
  - 'packages/*'

overrides:
  h3: 1.15.9
  undici: 6.27.0
  jsdom: ^27.4.0
  path-to-regexp: 8.4.0
  fastify: 5.8.5
  axios: 1.18.1
  fast-uri: 3.1.4
  devalue: 5.8.1
  yaml: 2.8.4
  postcss: '>=8.5.18'
  lodash: 4.18.1
  lucide-react: ^1.16.0
  react: ^19.2.6
  react-dom: ^19.2.6
  uuid: '>=11.1.1'
  tmp: 0.2.7
  shell-quote: 1.10.0
  form-data: 4.0.6
  ws: 8.21.0
  tar: 7.5.21
  js-yaml: 4.3.0
  piscina: 4.9.3
  '@opentelemetry/core': 2.8.0
  '@vitest/browser': '>=4.1.10'
  vitest: '>=4.1.10'
  esbuild: '>=0.28.1'
  vite: '>=7.3.5'
  '@babel/core': '>=7.29.6'
  find-my-way: '>=9.7.0'
  svgo: '>=4.0.2'
  '@xhmikosr/decompress': '>=11.1.3'
  valibot: '>=1.4.2'
  # CVE-2026-14257 (GHSA-mh99-v99m-4gvg): each major line has its own
  # patched release. @2 clears Dependabot alert #117 (>=2.0.0 <2.1.3,
  # patched at 2.1.3). @1 is left at 1.1.16 — its alert (#118, <1.1.17)
  # is auto-dismissed by GitHub, so it's out of scope here; a patched
  # 1.1.17+ is available if that line needs bumping later.
  'brace-expansion@1': 1.1.16
  'brace-expansion@2': '^2.1.3'
  'brace-expansion@5': '>=5.0.8'

onlyBuiltDependencies:
  - electron
  - esbuild
  - better-sqlite3
