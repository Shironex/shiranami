packages:
  - 'apps/*'
  # Mobile excluded: its React Native deps break electron-builder packaging
  # (pnpm list --depth Infinity exceeds Node.js string limits).
  # Re-add when mobile is ready for release + upgrade web to React 19.
  - '!apps/mobile'
  - 'packages/*'

overrides:
  # `@wdio/tauri-service@1.2.0` ships a dist that imports
  # `installMockSyncOverride` from `@wdio/native-utils` but pins that dependency
  # to an exact `2.4.0`, which does not export it — the pin lags the code it was
  # published alongside. Without this the service cannot even be loaded:
  # "SyntaxError: The requested module '@wdio/native-utils' does not provide an
  # export named 'installMockSyncOverride'". 2.5.0 is the first version that
  # does. Drop this the moment the service repins.
  '@wdio/native-utils': 2.5.0
  h3: 1.15.9
  undici: 6.27.0
  jsdom: ^27.4.0
  path-to-regexp: 8.4.0
  fastify: 5.8.5
  axios: 1.18.1
  fast-uri: 3.1.4
  devalue: 5.8.1
  yaml: 2.8.4
  postcss: '>=8.5.18'
  lodash: 4.18.1
  lucide-react: ^1.16.0
  react: ^19.2.6
  react-dom: ^19.2.6
  uuid: '>=11.1.1'
  tmp: 0.2.7
  shell-quote: 1.10.0
  form-data: 4.0.6
  ws: 8.21.0
  tar: 7.5.21
  js-yaml: 4.3.0
  piscina: 4.9.3
  '@opentelemetry/core': 2.8.0
  '@vitest/browser': '>=4.1.10'
  vitest: '>=4.1.10'
  esbuild: '>=0.28.1'
  vite: '>=7.3.5'
  '@babel/core': '>=7.29.6'
  find-my-way: '>=9.7.0'
  svgo: '>=4.0.2'
  '@xhmikosr/decompress': '>=11.1.3'
  valibot: '>=1.4.2'
  # CVE-2026-14257 is only patched on the 5.x line. The @1/@2 pins just hold
  # those lines at their newest release — they cannot clear the advisory, which
  # needs the `minimatch` parents dragging them in to move to 5.x.
  'brace-expansion@1': 1.1.16
  'brace-expansion@2': 2.1.2
  'brace-expansion@5': '>=5.0.8'

onlyBuiltDependencies:
  - electron
  - esbuild
  - better-sqlite3
