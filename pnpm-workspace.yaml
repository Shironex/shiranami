packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  # `@wdio/tauri-service@1.2.0` ships a dist that imports
  # `installMockSyncOverride` from `@wdio/native-utils` but pins that dependency
  # to an exact `2.4.0`, which does not export it — the pin lags the code it was
  # published alongside. Without this the service cannot even be loaded:
  # "SyntaxError: The requested module '@wdio/native-utils' does not provide an
  # export named 'installMockSyncOverride'". 2.5.0 is the first version that
  # does. Drop this the moment the service repins.
  '@wdio/native-utils': 2.5.0
  h3: 1.15.9
  undici: ^6.29.1
  jsdom: ^30.0.1
  path-to-regexp: 8.4.0
  # apps/server declares `^5.8.5`; the exact pin below it was blocking
  # fastify's own patched release (schema-validation bypass +
  # X-Forwarded-* spoofing fixes). Floor, not pin, so patch releases
  # keep flowing.
  'fastify@<5.12.6': 5.12.7
  axios: 1.18.1
  fast-uri: ^3.1.9
  # apps/landing's @astrojs/react wants `^5.8.1`; the pin below was
  # holding devalue back from its DoS-fix release. Bounded below 6.0.0 —
  # an unbounded floor here resolves to devalue 6.x, a major @astrojs/react
  # doesn't declare and hasn't been tested against; that's Phase 3 scope.
  devalue: '>=5.9.2 <6'
  yaml: 2.8.4
  postcss: '>=8.5.18'
  lodash: 4.18.1
  lucide-react: ^1.16.0
  react: ^19.2.6
  react-dom: ^19.2.6
  # Expo SDK 56 pins React 19.2.3 exactly (react-native 0.85.3 checks the
  # renderer version at startup), so the floor above must not lift the mobile
  # app. The parent selector wins over the bare `react` entry.
  '@shiranami/mobile>react': 19.2.3
  # @react-three/fiber (apps/landing) lists its React Native entry's packages
  # as optional peers, and pnpm fills an optional peer whenever the package is
  # anywhere in the graph. With apps/mobile in the workspace that gave landing
  # its own react-native and expo instances built against React 19.3. Landing
  # is web only, so those peers are removed for it.
  '@react-three/fiber>expo': '-'
  '@react-three/fiber>expo-asset': '-'
  '@react-three/fiber>expo-file-system': '-'
  '@react-three/fiber>expo-gl': '-'
  '@react-three/fiber>react-native': '-'
  uuid: '>=11.1.1'
  tmp: 0.2.7
  'shell-quote@<1.11.0': ^1.11.0
  form-data: 4.0.6
  ws: 8.21.0
  tar: 7.5.21
  js-yaml: ^4.3.2
  piscina: 4.9.4
  '@opentelemetry/core': 2.8.0
  # @vitest/mocker (the actual path-traversal CVE) is @vitest/browser's own
  # dependency, not vitest's — bumping `vitest` below doesn't cascade to it,
  # so this needs its own floor too. Bounded below 5.0.0 for the same reason
  # as vitest below.
  '@vitest/browser': '>=4.1.12 <5'
  # apps/web declares this directly; same @vitest/mocker dependency as
  # @vitest/browser above, needs the same floor for the same reason.
  '@vitest/browser-playwright': '>=4.1.12 <5'
  # One patch above the workspace root's and packages/eslint-plugin's prior
  # floor — same @vitest/mocker path-traversal fix. Bounded below 5.0.0 — an
  # unbounded floor here resolves to vitest 5.x, which breaks
  # @vitest/coverage-v8 and @vitest/browser-playwright peers (still on 4.x);
  # that major jump is tracked separately as a Phase 3 migration.
  vitest: '>=4.1.12 <5'
  esbuild: '>=0.28.1'
  # Pinned at 8.3.4 (fixes the 8.0-8.1.5 and 8.3.0-8.3.2 advisories): a floor
  # resolves 8.3.5, which is under the 7 day release age gate that pnpm 10.9.0
  # does not enforce. Relax to a floor once 8.3.5 has aged.
  vite: 8.3.4
  # Bounded below 8.0.0: every consumer here (babel-preset-expo, react-native,
  # jest, @sentry/bundler-plugins) declares the 7 line, and an unbounded floor
  # resolved Babel 8 for all of them.
  '@babel/core': '>=7.29.6 <8'
  find-my-way: '>=9.7.0'
  # astro (apps/landing) already resolves svgo's own patched release as of
  # the Phase 1 astro bump; floor kept at that patched version so a future
  # astro downgrade can't silently reintroduce it.
  svgo: '>=4.1.0'
  '@xhmikosr/decompress': '>=11.1.4'
  valibot: '>=1.4.2'
  # CVE-2026-14257 (GHSA-mh99-v99m-4gvg) and CVE-2026-69152 (the follow-up
  # bypass of that mitigation via unbounded intermediate arrays): each major
  # line has its own patched release. @2 clears Dependabot alert #117
  # (>=2.0.0 <2.1.3, patched at 2.1.3). @1 now floors at 1.1.21, which
  # patches both CVEs on the 1.x line.
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': '^2.1.7'
  'brace-expansion@5': '>=5.0.12'
  # eslint-plugin-react-hooks > @babel/core pulls this transitively;
  # unbounded memory growth (no cache eviction) + a prototype-write crash
  # on untrusted browserslist-stats.json, both fixed at this floor.
  browserslist: '>=4.28.7'
  # Same @babel/core chain as browserslist above; process-termination DoS
  # on invalid input, fixed at this floor.
  'baseline-browser-mapping': '>=2.11.0'
  # apps/desktop's @wdio/config (e2e devDep) pulls this; stack exhaustion
  # when merging recursive object graphs, fixed at this floor.
  'deepmerge-ts': '>=8.0.0'
  # apps/desktop's @wdio/mocha-framework > mocha (e2e devDep) pulls this;
  # RCE via RegExp.flags / Date.prototype.toISOString() plus a CPU-exhaustion
  # DoS on crafted array-likes, both fixed at this floor. One major above
  # what mocha@10.8.2 itself declares (^6.0.2) — mocha@12.0.2 already uses
  # serialize-javascript@^7.1.1 so the API is known-compatible, but verify
  # apps/desktop's e2e suite after bumping this.
  'serialize-javascript@<7.1.3': ^7.1.3
  # apps/desktop's @wdio/tauri-service > @wdio/native-utils (e2e devDep)
  # pulls this; DoS via malformed TOML documents, fixed at this floor.
  'smol-toml': '>=1.7.1'
  # prisma (apps/server) bundles mysql2 regardless of driver even though the
  # project is Postgres-only via @prisma/adapter-pg; auth-plugin downgrade
  # leaking plaintext credentials plus a decompression-bomb DoS, both fixed
  # at this floor.
  mysql2: '>=3.23.1'
  # root devDep chain vite > postcss pulls nanoid@3 (separate from the
  # nanoid@5 used directly in apps/server, hence the scoped `@3` syntax,
  # same pattern as brace-expansion above); DoS fix floor.
  'nanoid@3': '>=3.3.18'
  # The floor above resolves nanoid 6 (ESM only) for every `^3` consumer.
  # expo-router requires `nanoid/non-secure` from CommonJS, which Metro copes
  # with but jest-expo cannot load, so the mobile router keeps the 3 line.
  'expo-router>nanoid': '>=3.3.18 <4'
  # apps/landing's three.js stack: @react-three/drei pulls gainmap-js
  # (`^3.0.6`) and three-stdlib pulls draco3d (`^1.4.1`). Both had a burst of
  # releases in mid October 2026, under the 7 day release age gate that pnpm
  # 10.9.0 does not enforce. Held at the last release before each burst;
  # relax to floors once they have aged.
  '@monogrid/gainmap-js': 3.4.0
  draco3d: 1.5.7
  'ip-address@<10.7.4': 10.7.5
  'zod@>=4 <4.6.6': ^4.6.6

# Dependencies that packages use without declaring them. They only worked
# through accidental hoisting; under pnpm's isolated linker Metro cannot bundle
# without them. Drop an entry once the package declares the dependency itself.
# - nativewind: the Tailwind compile (dist/tailwind/native.js) requires
#   postcss. In watch mode the error is lost in a child process and Metro waits
#   forever.
# - react-native-worklets: its Babel plugin (loaded by reanimated) requires
#   @babel/traverse, @babel/generator and @babel/types.
# - @rn-primitives/*: the type declarations import React but the packages do
#   not declare @types/react. TypeScript then walks up into pnpm's hidden
#   hoist folder and picks the web app's @types/react, a second copy that
#   breaks every `ref` prop in apps/mobile. The optional peer links the
#   consumer's own copy instead.
packageExtensions:
  '@rn-primitives/portal':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  '@rn-primitives/slot':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  nativewind:
    dependencies:
      postcss: '^8.4.0'
  react-native-worklets:
    dependencies:
      '@babel/generator': '^7.28.0'
      '@babel/traverse': '^7.28.0'
      '@babel/types': '^7.28.0'

peerDependencyRules:
  allowedVersions:
    # The `react` override above also rewrites peer ranges to ^19.2.6, so
    # every React Native package in apps/mobile reports its 19.2.3 as unmet.
    # This also covers expo-router's web half, whose `react-dom` peer pulls the
    # newest react-dom; the app is native only and nothing imports react-dom.
    react: '19.2.3'
    # Same split for the typings: expo-router's web half pulls the newest
    # @types/react-dom, which asks for the web app's @types/react.
    '@types/react-dom>@types/react': '19.2'

onlyBuiltDependencies:
  - esbuild

# The owner's global npm config sets a 7 day minimum release age. First-party
# @noctcore packages are published by the owner and may be installed as soon as
# they are out. The pinned pnpm 10.9.0 enforces neither the gate nor this
# exclusion; newer pnpm releases read both.
minimumReleaseAgeExclude:
  - '@noctcore/*'

# expo-audio 56 drops next/previous from its Android media session. The patch
# offers them for non-live tracks and emits a `lockScreenSkip` event that the
# mobile playback service maps to the queue. expo-audio 58 has an official
# version of this for AudioPlaylist only; drop the patch when the app moves to
# an SDK whose expo-audio covers a single player with a JS queue.
patchedDependencies:
  expo-audio@56.0.13: patches/expo-audio@56.0.13.patch
