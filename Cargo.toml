#  Shiranami v2 — Rust workspace.
#
#  Lives inside the existing pnpm workspace (docs/v2/architecture.md §2.1): the
#  domain crates under `crates/` own all backend logic, and
#  `apps/desktop-tauri/src-tauri` is a thin composition root that wires them
#  into a Tauri v2 shell. The dependency spine runs one way only —
#  core → net → { db, serve, metadata, integrations }, core → audio,
#  { db, metadata } → library, { net, db } → downloader,
#  { db, downloader } → recommendation, core → media-controls, everything →
#  src-tauri — and is expressed by the path dependencies below.

[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop-tauri/src-tauri"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Shironex"]
license = "SEE LICENSE IN LICENSE"
repository = "https://github.com/Shironex/shiranami"
publish = false

[workspace.dependencies]
# Internal crates — the layering spine. Depend on these, never on a sibling
# that sits above you in the ordering documented at the top of this file.
shiranami-core = { path = "crates/shiranami-core" }
shiranami-net = { path = "crates/shiranami-net" }
shiranami-db = { path = "crates/shiranami-db" }
shiranami-audio = { path = "crates/shiranami-audio" }
shiranami-metadata = { path = "crates/shiranami-metadata" }
shiranami-library = { path = "crates/shiranami-library" }
shiranami-downloader = { path = "crates/shiranami-downloader" }
shiranami-integrations = { path = "crates/shiranami-integrations" }
shiranami-recommendation = { path = "crates/shiranami-recommendation" }
shiranami-serve = { path = "crates/shiranami-serve" }
shiranami-media-controls = { path = "crates/shiranami-media-controls" }

# External — pinned per docs/v2/architecture.md Appendix B. Only the
# dependencies Phase 1 actually compiles are listed; each later phase adds its
# own row here rather than in a leaf crate, so versions stay unified.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-build = "2"
tauri-plugin-single-instance = "2.4"
thiserror = "2"
tracing = "0.1"

# Exact pins, as nuclear ships (architecture D6/R11): tauri-specta is
# perpetually pre-1.0, and a floating rc would resolve differently between a
# local run and CI — which is precisely how a regenerate-and-diff guard starts
# failing for reasons that have nothing to do with drift.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
specta-serde = "=0.0.12"

# Phase 3 (`shiranami-net`). reqwest 0.13 already resolves `default-tls` to
# rustls, so the explicit list is not about picking a TLS stack — it is about
# dropping what we never use (`charset`, `blocking`, `cookies`) while keeping
# `system-proxy`, which is the one Chromium behaviour `electron.net` gave the v1
# client for free and a corporate-proxy user would notice losing.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "http2",
  "gzip",
  "brotli",
  "system-proxy",
] }
# `net` is here for the SSRF guard's DNS resolution and nothing else; the guard
# must resolve a hostname *itself* rather than trust the connector, or the
# range classification has nothing to classify. Phase 8 adds `fs` and `io-util`:
# the audio route streams a file range off disk rather than buffering it, which
# is the whole reason a 300 MB FLAC does not become 300 MB of resident memory.
# Phase 11 adds `process`: yt-dlp, ffmpeg and `xattr` are child processes, and
# `kill_on_drop(true)` — the R20 mitigation — is a `tokio::process` method.
tokio = { version = "1", features = [
  "net",
  "rt",
  "sync",
  "time",
  "fs",
  "io-util",
  "process",
] }
url = "2.5"
httpdate = "1"

# Phase 5 (`shiranami-audio`) — the Rust replacement for the C++ N-API addon.
# `symphonia` decodes strictly more than the vendored dr_libs did, and `ebur128`
# is a port of the vendored libebur128, so the LUFS the volume-leveling feature
# already persisted stay comparable (architecture §2.9, Appendix B).
#
# `alac` is the one addition to Appendix B's feature list: `.m4a` is in v1's
# accepted-extension set and an iTunes-ripped `.m4a` holds ALAC, not AAC, so
# without it a format v1 played would analyse as undecodable.
symphonia = { version = "0.6", features = [
  "mp3",
  "flac",
  "isomp4",
  "aac",
  "alac",
  "opt-simd",
] }
ebur128 = "0.1.10"

# Phase 6 (`shiranami-db`). Feature set as Appendix B pins it. `sqlite` brings
# a bundled SQLite, so the engine is the same on every platform and in CI —
# which matters more than usual here, because the `sqlite_master` diff test
# compares schema *text* and a host libsqlite3 would put the build machine in
# that comparison. `macros` is unused in Phase 6 and pinned for Phase 7's
# `query_as!`; nothing compiles it until then.
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "migrate",
] }

# Names the waveform-peaks cache files. v1 keyed them `sha256(path|mtime|size)`
# truncated to 128 bits and v2 adopts that cache verbatim (§3.3), so the hash is
# a compatibility constraint, not an implementation choice. Pinned to the 0.10
# line already resolved in the lockfile so the tree holds one `digest` version.
sha2 = "0.10"

# Phase 7 (`shiranami-db` repositories). Every row this crate inserts carries an
# id the *application* generates, because v1's handlers did: `crypto.randomUUID()`
# in the main process, never a SQLite default. Keeping the ids v4 UUIDs keeps the
# zod `z.string().uuid()` guards on v1's IPC surface satisfiable, which is what a
# handover-window rollback depends on.
uuid = { version = "1", features = ["v4"] }

# Phase 8 (`shiranami-serve`). The loopback byte server.
#
# axum runs with `default-features = false`: the webview speaks HTTP/1.1 over
# loopback and nothing else, and every feature left out — `json`, `form`,
# `multipart`, `ws`, `http2` — is a parser this server would otherwise expose to
# any local process that guesses the port. `query` is out too: the routes read
# their parameters through `url::form_urlencoded` directly, because that is what
# reproduces `URLSearchParams`' rule that `+` decodes to a space — see
# `routes::query`.
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
# `io` gives `ReaderStream`, which turns the seeked-and-limited file handle into
# a chunked body. It is the difference between streaming and `fs::read`.
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
# The session token is a credential, so its bytes come from the OS CSPRNG and
# are compared in constant time. `subtle` rather than a hand-rolled fold because
# the compiler is allowed to short-circuit the hand-rolled one.
getrandom = "0.3"
subtle = "2"

# Phase 11 (`shiranami-downloader`).
#
# `zip` is the one genuinely new dependency, and it pays for two things at once
# (architecture §2.2 #19). On Windows it deletes v1's three-tier extraction
# fallback — a worker thread trying adm-zip, then `tar`, then PowerShell — and on
# macOS it deletes the `unzip` child process, so ffmpeg installation stops
# shelling out to a tool that may not be on a Finder-launched PATH at all (R19).
# `deflate` is the only compression method the evermeet and gyan.dev archives
# use; the rest are decoders we would be exposing for no reason. Entry paths are
# validated through `enclosed_name()`, which v1's PowerShell path could not do.
zip = { version = "6", default-features = false, features = ["deflate"] }
# Already in the tree transitively; pinned here because this crate now depends on
# it directly. Six ported patterns need it — the version-segment scan, ffmpeg's
# version line, yt-dlp's `Destination:` and `[download] N%` progress lines, the
# `__NEXT_DATA__` script tag, and the Spotify title/artists fallback — and a
# hand-rolled scanner per pattern is six chances to diverge from a v1 regex the
# renderer's behaviour already depends on.
regex = "1"
# `normalizeForMatch` opens with `.normalize('NFKD')` before stripping combining
# marks, which is what makes "Söng" and "song" compare equal in the Spotify
# matcher. Without it the diacritic strip has nothing decomposed to strip.
unicode-normalization = "0.1"
# The process seam is an `Arc<dyn ProcessRunner>` so the queue's state machine
# can be driven without a real yt-dlp. Native `async fn` in traits is not
# dyn-compatible, and this is the standard way to get there without hand-writing
# `Pin<Box<dyn Future>>` at every implementation site.
async-trait = "0.1"

tempfile = "3"

# Lints are declared once and inherited by every member via `[lints] workspace
# = true`. CI runs clippy with `-D warnings`, so a warn here is a hard gate.
[workspace.lints.rust]
unsafe_code = "deny"
# A group, so it needs a lower priority than the single lints around it.
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
# Holding a std lock across an await deadlocks the tokio worker — the reason
# `tokio::sync::Mutex` is reserved for exactly that case (architecture §2.3).
await_holding_lock = "warn"
# `.unwrap()` in a desktop app is a user-visible crash; propagate instead.
unwrap_used = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.dev]
# Rebuild surface is already split by the crate boundaries; keep incremental on
# so a one-crate edit does not rebuild the workspace (architecture §6.1, R9).
incremental = true

[profile.release]
lto = true
codegen-units = 1
strip = true
