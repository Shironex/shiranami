[package]
name = "shiranami-desktop"
description = "Shiranami desktop shell (Tauri v2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "shiranami-desktop"

[lib]
# The shell is a library so commands and boot wiring stay unit-testable; the
# binary below is a three-line entry point.
name = "shiranami_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tracing = { workspace = true }

# Phase 14. The command/event surface and the bindings it emits.
#
# `specta-typescript` and `specta-serde` are here because this crate now owns
# the *file* the drift guard diffs: `shiranami-core` still declares the type
# vocabulary, but a command signature is what pulls a type into the export, so
# the exporter has to run where the commands are.
specta = { workspace = true }
specta-serde = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }

# The command layer acquires the pool's one connection and passes `&mut *conn`
# down (`shiranami_db::repo`), so it names `SqliteConnection` in its own
# signatures. No SQL is written here — that stays in `shiranami-db`.
sqlx = { workspace = true }

# The two composition-root seams (`crate::seam`) are `Arc<dyn Trait>` with async
# methods, and native `async fn` in traits is not dyn-compatible. Same reason
# `shiranami-downloader` takes it for its `ProcessRunner`.
async-trait = { workspace = true }

# The composition root depends on every domain crate; no domain crate depends
# on it. Wiring lives here, logic never does — any file in this crate that
# grows past 400 code lines means logic leaked out of a crate.
shiranami-audio = { workspace = true }
shiranami-core = { workspace = true }
shiranami-db = { workspace = true }
shiranami-downloader = { workspace = true }
shiranami-integrations = { workspace = true }
shiranami-library = { workspace = true }
shiranami-media-controls = { workspace = true }
shiranami-metadata = { workspace = true }
shiranami-net = { workspace = true }
shiranami-recommendation = { workspace = true }
shiranami-serve = { workspace = true }

[dev-dependencies]
# The reference namespaces are tested against the real state composition, which
# means a real database file and a real settings file — both temporary.
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
