<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#110e1a" />
    <title>Shiranami</title>
    <style>
      html {
        background-color: #110e1a;
      }
      /* The shell sizes to its parent instead of 100vw/100vh (which count the
         scrollbar gutter), and the document itself never scrolls: a 1px
         overflow at fractional WebView2 DPI would otherwise lock in both
         window scrollbars. Every view scrolls inside its own container. Lives
         here, not in globals.css, so Storybook pages can still scroll. */
      html,
      body,
      #root {
        height: 100%;
        overflow: hidden;
      }
    </style>
    <!--
      Applies the persisted theme before React mounts so a non-default theme
      never flashes the bare baseline for one frame. A module rather than an
      inline script because the packaged CSP is `script-src 'self'`, which
      blocks inline execution outright. Must stay above the /src/main.tsx entry:
      module scripts run in document order.
    -->
    <script type="module" src="/src/lib/theme-init.ts"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
