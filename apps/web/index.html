<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#110e1a" />
    <title>Shiranami</title>
    <style>
      html { background-color: #110e1a; }
    </style>
    <script>
      // Apply the persisted theme before React mounts so a non-default theme
      // never flashes the bare baseline for one frame. Read-only + defensive:
      // wrapped in try/catch and guarded so "none" leaves <html> attribute-free.
      try {
        var t = JSON.parse(localStorage.getItem('shiranami.theme') || '{}');
        var id = t && t.state && t.state.theme;
        if (id && id !== 'none') document.documentElement.dataset.theme = id;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
