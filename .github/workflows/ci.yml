name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [master, v2]
  pull_request:
    branches: [master, v2]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # skip husky install on CI
  HUSKY: 0

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.root == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.database == 'true' || steps.filter.outputs.contracts == 'true' || steps.filter.outputs.recommendation == 'true' || steps.filter.outputs.tooling == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.desktop == 'true' || steps.filter.outputs.server == 'true' }}
      web: ${{ steps.filter.outputs.root == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.web == 'true' }}
      landing: ${{ steps.filter.outputs.root == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.landing == 'true' }}
      desktopTauri: ${{ steps.filter.outputs.root == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.contracts == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.desktopTauri == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            root:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc'
              - '.gitignore'
              - 'vitest.config.ts'
              - 'scripts/rebuild-native.mjs'
            ci:
              - '.github/**'
              - 'scripts/set-version-ci.sh'
              - 'scripts/bump-version.mjs'
            shared:
              - 'packages/shared/**'
            database:
              - 'packages/database/**'
            contracts:
              - 'packages/contracts/**'
            recommendation:
              - 'packages/recommendation/**'
            # Custom lint rules + the lint-meta runner and codegen scripts:
            # they gate every other package, so a change here has to run the
            # full code battery even when no app source moved.
            tooling:
              - 'packages/eslint-plugin/**'
              - 'tools/**'
            web:
              - 'apps/web/**'
            desktop:
              - 'apps/desktop/**'
            # The v2 shell and everything its E2E binary links. `crates/**` and
            # the workspace manifests are in here because the suite drives a
            # real `cargo build` of the whole tree, so a change three crates
            # down is a change to the thing under test.
            desktopTauri:
              - 'apps/desktop-tauri/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            server:
              - 'apps/server/**'
              - 'Dockerfile.server'
              - 'docker-compose.yml'
            landing:
              - 'apps/landing/**'
              - 'Dockerfile.landing'
              - 'README.md'

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      # Repo-convention rules that ESLint can't express (file placement,
      # forbidden source text, architecture boundaries). The runner discovers
      # its own targets, so no file list is pinned here and new rules are
      # picked up without touching this workflow.
      - name: Lint meta
        run: pnpm lint:meta

      # `crates/shiranami-metadata/fixtures/v1-art.json` records what v1's real
      # album-art pipelines produce, and `tests/art_v1_compat.rs` asserts
      # against it hermetically — so only this step can notice that the file has
      # stopped describing v1 (architecture §3.3, risk R14).
      #
      # It runs here rather than in `rust-checks` because it executes v1's
      # actual `sharp`, which is a `node_modules` dependency, and that job
      # deliberately skips `pnpm install`. Reimplementing the pipeline with Node
      # builtins would measure the reimplementation instead of measuring v1.
      # The Electron half of the fixture is captured by hand and carried
      # forward; CI never spawns Electron.
      - name: v1 album-art fixture is not stale
        run: pnpm verify:art-baseline

      # The release manifests are read by the v1 Electron bridge and by
      # `tauri-plugin-updater`, neither of which is in this repo's test surface,
      # and the bridge's failure mode for a malformed manifest is *silence* —
      # it goes dormant and logs one line. So the generator's guards are checked
      # here, on every change, rather than first at release time.
      - name: Release manifest generator self-test
        run: pnpm verify:release-manifests

      - name: Format check
        run: pnpm format:check

  typecheck:
    name: Type Check
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      - name: Type check
        run: pnpm typecheck

  test:
    name: Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      - name: Test
        run: pnpm test

  test-storybook:
    name: Storybook Tests
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      # Stories run as real-browser tests (render smoke + play interactions +
      # axe a11y) via @storybook/addon-vitest + Playwright Chromium, so the
      # browser and its OS deps must be installed before the test command.
      - name: Install Chromium
        run: pnpm --filter @shiranami/web exec playwright install chromium --with-deps

      - name: Run Storybook tests
        run: pnpm --filter @shiranami/web test:storybook

  mock-mode:
    # The `:15175` browser-mode contract (architecture §8 ring 4, risk R5).
    # macOS lost CDP-driven visual checks when the shell became a WKWebView, and
    # browser mode plus Storybook are what replaced them — both only work while
    # `apps/web` boots with no backend attached and the Tauri bridge stays
    # inert. `install.test.ts` asserts that in jsdom; this asserts it in a real
    # browser, against the real dev server, after the app has painted.
    name: Mock Mode (browser)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      # The script starts `pnpm dev:web` itself and waits for :15175.
      - name: Check mock mode
        run: pnpm check:mock-mode

  size:
    name: Bundle Size
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      - name: Build web renderer
        run: pnpm --filter @shiranami/web build

      - name: Check bundle size
        run: pnpm --filter @shiranami/web size

  landing:
    name: Landing Check
    needs: [changes]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Astro check
        run: pnpm check:landing

      - name: Build landing site
        run: pnpm build:landing

  e2e:
    name: E2E (Electron)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    # Pin to 22.04 — this matches the Playwright-jammy Docker image we
    # validate against locally. 24.04 (ubuntu-latest) ships libasound2t64
    # instead of libasound2 + a slightly different xvfb defaults; until
    # those quirks are sorted the e2e job stays on a known-good base.
    runs-on: ubuntu-22.04
    # Hard cap: setup + build + 30 specs at ~5 s avg + retries should land in
    # 4–6 min. 15 min is generous; a job that hits this ceiling is in trouble
    # and should fail fast rather than burn the rest of the runner budget.
    timeout-minutes: 15
    env:
      # Capture renderer + main process logs so a silent boot hang leaves
      # diagnosable evidence in the job log instead of just a timeout.
      ELECTRON_ENABLE_LOGGING: '1'
      ELECTRON_ENABLE_STACK_DUMPING: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      # Electron uses Chromium under the hood, so it needs the same OS libs
      # any headless Chromium installation needs. `playwright install-deps`
      # is the canonical list — Playwright owns the matrix of "what does
      # Chromium need on this distro" and we get free updates as Chromium
      # versions move. xvfb is added explicitly because install-deps no
      # longer pulls it on jammy.
      - name: Install Chromium / Electron system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          pnpm exec playwright install-deps chromium

      # `pnpm build` chains build:packages → web build → desktop build (esbuild
      # + renderer copy). E2E launches the built artefact at apps/desktop/dist,
      # so the build must run before the spec command.
      - name: Build
        run: pnpm build

      # better-sqlite3 ships a Node-ABI prebuilt binary that pnpm restores
      # from the setup-node cache. electron-builder install-app-deps records
      # rebuild status in .forge-meta — when the cache restores a binary
      # whose ABI doesn't match the marker, the rebuild step assumes "done"
      # and silently leaves a Node-ABI .node on disk. The renderer then dies
      # at `bootstrap → initializeDatabase` with NODE_MODULE_VERSION 127 vs
      # 145 and Playwright sees nothing but a firstWindow timeout. Forcing
      # the rebuild — by clearing the markers and passing -f to
      # @electron/rebuild — guarantees the .node file matches Electron's ABI.
      - name: Force-rebuild native modules for Electron
        working-directory: apps/desktop
        run: |
          find ../../node_modules -name '.forge-meta' -type f -delete || true
          npx --no -- @electron/rebuild -f

      # Start Xvfb explicitly with a known screen geometry. The xvfb-run
      # wrapper picks defaults that have caused Electron renderers to hang
      # waiting on a display; an explicit 1280x720x24 server is the recipe
      # the Playwright Docker image uses and matches our local repro.
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # Give Xvfb a beat to bind the socket before the first launch.
          sleep 1

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-tauri:
    name: E2E (v2 shell)
    needs: changes
    if: needs.changes.outputs.desktopTauri == 'true'
    # macOS, and not by preference. WKWebView exposes neither CDP nor a
    # WebDriver of its own, so `tauri-driver` does not exist here and the
    # embedded `tauri-plugin-wdio-webdriver` is the only way in — which is also
    # the platform the suite is written against: it redirects `HOME` and asserts
    # on `~/Library/Application Support` and a `darwin` platform string.
    runs-on: macos-latest
    # A cold Rust build of eleven crates plus twelve app launches.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      # Builds the frontend first and then the binary that embeds it. The `e2e`
      # feature carries `tauri/custom-protocol`, without which `tauri-codegen`
      # embeds no assets at all and points the webview at the Vite dev server —
      # a binary that boots to a blank page and fails every spec on a timeout.
      - name: Build the E2E binary
        run: pnpm --filter @shiranami/desktop-tauri run e2e:build

      - name: Run E2E tests
        run: pnpm --filter @shiranami/desktop-tauri run test:e2e

      # The app's own log per profile — for a failure, the Rust side's account
      # of the same run. `.tmp` is gitignored and holds nothing else.
      - name: Upload E2E profiles on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tauri-profiles
          path: apps/desktop-tauri/e2e/.tmp/
          retention-days: 7
          if-no-files-found: ignore

  ci-result:
    name: CI Result
    if: always()
    needs: [lint, typecheck, test, test-storybook, mock-mode, size, e2e, e2e-tauri, landing]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI outcome
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped"
