name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [master, v2]
  pull_request:
    branches: [master, v2]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # skip husky install on CI
  HUSKY: 0

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.root == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.contracts == 'true' || steps.filter.outputs.tooling == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.desktop == 'true' || steps.filter.outputs.server == 'true' }}
      web: ${{ steps.filter.outputs.root == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.web == 'true' }}
      landing: ${{ steps.filter.outputs.root == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.landing == 'true' }}
      desktop: ${{ steps.filter.outputs.root == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.contracts == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.desktop == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            root:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc'
              - '.gitignore'
              - 'vitest.config.ts'
            ci:
              - '.github/**'
              - 'scripts/set-version.mjs'
            shared:
              - 'packages/shared/**'
            contracts:
              - 'packages/contracts/**'
            # Custom lint rules + the lint-meta runner and codegen scripts:
            # they gate every other package, so a change here has to run the
            # full code battery even when no app source moved.
            tooling:
              - 'packages/eslint-plugin/**'
              - 'tools/**'
            web:
              - 'apps/web/**'
            # The desktop shell and everything its E2E binary links. `crates/**`
            # and the workspace manifests are in here because the suite drives a
            # real `cargo build` of the whole tree, so a change three crates
            # down is a change to the thing under test.
            desktop:
              - 'apps/desktop/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            server:
              - 'apps/server/**'
              - 'Dockerfile.server'
              - 'docker-compose.yml'
            landing:
              - 'apps/landing/**'
              - 'Dockerfile.landing'
              - 'README.md'

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      # Repo-convention rules that ESLint can't express (file placement,
      # forbidden source text, architecture boundaries). The runner discovers
      # its own targets, so no file list is pinned here and new rules are
      # picked up without touching this workflow.
      - name: Lint meta
        run: pnpm lint:meta

      # The release manifests are read by the v1 Electron bridge and by
      # `tauri-plugin-updater`, neither of which is in this repo's test surface,
      # and the bridge's failure mode for a malformed manifest is *silence* —
      # it goes dormant and logs one line. So the generator's guards are checked
      # here, on every change, rather than first at release time.
      - name: Release manifest generator self-test
        run: pnpm verify:release-manifests

      - name: Format check
        run: pnpm format:check

  typecheck:
    name: Type Check
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      - name: Type check
        run: pnpm typecheck

  test:
    name: Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      - name: Test
        run: pnpm test

  test-storybook:
    name: Storybook Tests
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      # Stories run as real-browser tests (render smoke + play interactions +
      # axe a11y) via @storybook/addon-vitest + Playwright Chromium, so the
      # browser and its OS deps must be installed before the test command.
      - name: Install Chromium
        run: pnpm --filter @shiranami/web exec playwright install chromium --with-deps

      - name: Run Storybook tests
        run: pnpm --filter @shiranami/web test:storybook

  mock-mode:
    # The `:15175` browser-mode contract (architecture §8 ring 4, risk R5).
    # macOS lost CDP-driven visual checks when the shell became a WKWebView, and
    # browser mode plus Storybook are what replaced them — both only work while
    # `apps/web` boots with no backend attached and the Tauri bridge stays
    # inert. `install.test.ts` asserts that in jsdom; this asserts it in a real
    # browser, against the real dev server, after the app has painted.
    name: Mock Mode (browser)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      # The script starts `pnpm dev:web` itself and waits for :15175.
      - name: Check mock mode
        run: pnpm check:mock-mode

  size:
    name: Bundle Size
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      - name: Build web renderer
        run: pnpm --filter @shiranami/web build

      - name: Check bundle size
        run: pnpm --filter @shiranami/web size

  landing:
    name: Landing Check
    needs: [changes]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Astro check
        run: pnpm check:landing

      - name: Build landing site
        run: pnpm build:landing

  e2e-tauri:
    name: E2E (v2 shell)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # macOS, and not by preference. WKWebView exposes neither CDP nor a
    # WebDriver of its own, so `tauri-driver` does not exist here and the
    # embedded `tauri-plugin-wdio-webdriver` is the only way in — which is also
    # the platform the suite is written against: it redirects `HOME` and asserts
    # on `~/Library/Application Support` and a `darwin` platform string.
    runs-on: macos-latest
    # A cold Rust build of eleven crates plus twelve app launches.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      # Builds the frontend first and then the binary that embeds it. The `e2e`
      # feature carries `tauri/custom-protocol`, without which `tauri-codegen`
      # embeds no assets at all and points the webview at the Vite dev server —
      # a binary that boots to a blank page and fails every spec on a timeout.
      - name: Build the E2E binary
        run: pnpm --filter @shiranami/desktop run e2e:build

      - name: Run E2E tests
        run: pnpm --filter @shiranami/desktop run test:e2e

      # The app's own log per profile — for a failure, the Rust side's account
      # of the same run. `.tmp` is gitignored and holds nothing else.
      - name: Upload E2E profiles on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tauri-profiles
          path: apps/desktop/e2e/.tmp/
          retention-days: 7
          if-no-files-found: ignore

  ci-result:
    name: CI Result
    if: always()
    needs: [lint, typecheck, test, test-storybook, mock-mode, size, e2e-tauri, landing]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI outcome
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped"
