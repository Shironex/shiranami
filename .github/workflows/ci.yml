name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # skip husky install on CI
  HUSKY: 0

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.root == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.database == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.desktop == 'true' || steps.filter.outputs.server == 'true' }}
      landing: ${{ steps.filter.outputs.root == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.landing == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            root:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc'
              - '.gitignore'
              - 'vitest.config.ts'
              - 'scripts/rebuild-better-sqlite-for-node.mjs'
              - 'scripts/run-vitest.mjs'
            ci:
              - '.github/**'
              - 'scripts/set-version-ci.sh'
              - 'scripts/bump-version.mjs'
            shared:
              - 'packages/shared/**'
            database:
              - 'packages/database/**'
            web:
              - 'apps/web/**'
            desktop:
              - 'apps/desktop/**'
            server:
              - 'apps/server/**'
              - 'Dockerfile.server'
              - 'docker-compose.yml'
            landing:
              - 'apps/landing/**'
              - 'Dockerfile.landing'
              - 'README.md'

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Type Check
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      - name: Type check
        run: pnpm typecheck

  test:
    name: Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      - name: Test
        run: pnpm test

  landing:
    name: Landing Check
    needs: [changes]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Astro check
        run: pnpm check:landing

      - name: Build landing site
        run: pnpm build:landing

  ci-result:
    name: CI Result
    if: always()
    needs: [lint, typecheck, test, landing]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI outcome
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped"
