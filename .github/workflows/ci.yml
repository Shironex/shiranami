name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # skip husky install on CI
  HUSKY: 0

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.root == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.database == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.desktop == 'true' || steps.filter.outputs.server == 'true' }}
      landing: ${{ steps.filter.outputs.root == 'true' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.landing == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            root:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc'
              - '.gitignore'
              - 'vitest.config.ts'
              - 'scripts/rebuild-better-sqlite-for-node.mjs'
              - 'scripts/run-vitest.mjs'
            ci:
              - '.github/**'
              - 'scripts/set-version-ci.sh'
              - 'scripts/bump-version.mjs'
            shared:
              - 'packages/shared/**'
            database:
              - 'packages/database/**'
            web:
              - 'apps/web/**'
            desktop:
              - 'apps/desktop/**'
            server:
              - 'apps/server/**'
              - 'Dockerfile.server'
              - 'docker-compose.yml'
            landing:
              - 'apps/landing/**'
              - 'Dockerfile.landing'
              - 'README.md'

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Type Check
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      - name: Type check
        run: pnpm typecheck

  test:
    name: Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared packages
        run: pnpm build:packages

      - name: Test
        run: pnpm test

  landing:
    name: Landing Check
    needs: [changes]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Astro check
        run: pnpm check:landing

      - name: Build landing site
        run: pnpm build:landing

  e2e:
    name: E2E (Electron)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      # Electron requires a display server on Linux. xvfb gives every test
      # its own virtual display without needing a GUI runner image.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # `pnpm build` chains build:packages → web build → desktop build (esbuild
      # + renderer copy). E2E launches the built artefact at apps/desktop/dist,
      # so the build must run before the spec command.
      - name: Build
        run: pnpm build

      # better-sqlite3's native binding is rebuilt against Electron's ABI by
      # the desktop app's postinstall hook (electron-builder install-app-deps).
      # The setup action ran install with --frozen-lockfile, so the rebuild
      # already happened; this step is a belt-and-braces no-op for clarity.
      - name: Rebuild native modules for Electron (no-op if cached)
        run: pnpm rebuild:electron

      - name: Run E2E tests
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore

  ci-result:
    name: CI Result
    if: always()
    needs: [lint, typecheck, test, e2e, landing]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI outcome
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped"
