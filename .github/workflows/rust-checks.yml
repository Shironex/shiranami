name: Rust Checks

# Path-filtered on purpose: the pnpm CI in ci.yml and this workflow share a
# repo but not a toolchain, and neither should be waiting on the other.

permissions:
  contents: read

# (Duplicated rather than anchored: GitHub Actions does not resolve YAML
# aliases. Keep the two lists identical.)
on:
  push:
    branches: [master, v2]
    paths:
      - 'crates/**'
      - 'apps/desktop-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.github/workflows/rust-checks.yml'
  pull_request:
    branches: [master, v2]
    paths:
      - 'crates/**'
      - 'apps/desktop-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.github/workflows/rust-checks.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing here publishes; keep the fetch quiet and reproducible.
  CARGO_INCREMENTAL: 0

jobs:
  rust-checks:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Tauri links against the system webview even when we only lint it.
      # Linux is not a shipping target (architecture §1.2); this is only so the
      # cheapest runner can compile the shell.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Installs exactly the toolchain pinned in rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-checks-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-checks-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  rust-cross-check:
    # souvlaki, taskbar progress, WebView2 browser args and the macOS keychain
    # bindings are all cfg-gated, so a Linux-only lint never compiles them.
    # Required, not advisory (architecture D24).
    name: Rust cross-check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-cross-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-cross-

      # `-- -D warnings` denies in the workspace crates only, never in
      # dependencies — unlike RUSTFLAGS, which would fail on third-party noise.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
