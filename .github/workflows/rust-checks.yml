name: Rust Checks

# Path-filtered on purpose: the pnpm CI in ci.yml and this workflow share a
# repo but not a toolchain, and neither should be waiting on the other.

permissions:
  contents: read

# (Duplicated rather than anchored: GitHub Actions does not resolve YAML
# aliases. Keep the two lists identical.)
on:
  push:
    branches: [master, v2]
    paths:
      - 'crates/**'
      - 'apps/desktop-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      # Emitted by cargo test and diffed by this workflow, so an edit to either
      # the bindings or the prover has to re-run the gate that owns them.
      - 'packages/contracts/src/generated/**'
      - 'scripts/verify-drift-guard.mjs'
      # v1's migrations are the reference the committed schema fixture is
      # generated from, so a change there has to re-run the fixture check.
      - 'packages/database/drizzle/**'
      - 'packages/database/src/migrate.ts'
      - 'scripts/verify-db-baseline.mjs'
      - '.github/workflows/rust-checks.yml'
  pull_request:
    branches: [master, v2]
    paths:
      - 'crates/**'
      - 'apps/desktop-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      # Emitted by cargo test and diffed by this workflow, so an edit to either
      # the bindings or the prover has to re-run the gate that owns them.
      - 'packages/contracts/src/generated/**'
      - 'scripts/verify-drift-guard.mjs'
      # v1's migrations are the reference the committed schema fixture is
      # generated from, so a change there has to re-run the fixture check.
      - 'packages/database/drizzle/**'
      - 'packages/database/src/migrate.ts'
      - 'scripts/verify-db-baseline.mjs'
      - '.github/workflows/rust-checks.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing here publishes; keep the fetch quiet and reproducible.
  CARGO_INCREMENTAL: 0

jobs:
  rust-checks:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Tauri links against the system webview even when we only lint it.
      # Linux is not a shipping target (architecture §1.2); this is only so the
      # cheapest runner can compile the shell.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Installs exactly the toolchain pinned in rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: rustup show

      # Only so `pnpm verify:drift-guard` resolves below. The script itself uses
      # nothing but Node builtins, git and cargo, so the workspace install is
      # skipped — this job has no business waiting on node_modules.
      - name: Setup pnpm and Node
        uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-checks-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-checks-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Re-exports the TypeScript bindings as a side effect (architecture §2.5:
      # "export runs inside `cargo test`"), which is what gives the next step
      # something to diff.
      - name: Test
        run: cargo test --workspace

      - name: Bindings are up to date
        run: |
          git diff --exit-code packages/contracts/src/generated \
            || {
              echo "::error::Generated bindings are stale. Run \`cargo test -p shiranami-core --lib bindings\` and commit packages/contracts/src/generated."
              exit 1
            }

      # The diff above is only a gate if it can still fail. This perturbs a
      # `#[derive(specta::Type)]` type and REQUIRES the diff to trip — nightcore
      # shipped a drift guard that was vacuous for its entire life (issue #422,
      # risk R17), and a guard that silently no-ops is worse than no guard.
      - name: Drift guard is not vacuous
        run: pnpm verify:drift-guard

      # `crates/shiranami-db/fixtures/v1-schema.json` is the reference the
      # `sqlite_master` diff test proves the squashed baseline against, and it
      # is generated from `packages/database`. The cargo test is hermetic
      # against the committed file, so only this step can notice that the file
      # has stopped describing v1 (architecture §3.2, risk R6). Uses nothing but
      # Node builtins — `node:sqlite`, no `node_modules` — which is why it fits
      # in this install-free job.
      - name: v1 schema fixture is not stale
        run: pnpm verify:db-baseline

  rust-cross-check:
    # souvlaki, taskbar progress, WebView2 browser args and the macOS keychain
    # bindings are all cfg-gated, so a Linux-only lint never compiles them.
    # Required, not advisory (architecture D24).
    name: Rust cross-check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-cross-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-cross-

      # `-- -D warnings` denies in the workspace crates only, never in
      # dependencies — unlike RUSTFLAGS, which would fail on third-party noise.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
